<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <!-- 八分音符（音乐封面 / 音乐 APP 共用） -->
    <g id="ic-note">
      <circle cx="-8" cy="18" r="13"/>
      <rect x="3" y="-34" width="6" height="54" rx="3"/>
      <path d="M 9,-34 C 26,-28 30,-10 26,2 C 21,-9 15,-14 9,-13 Z"/>
    </g>
    <!-- 时钟 -->
    <g id="ic-clock" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <circle r="15"/>
      <path d="M 0,0 V -10 M 0,0 H 8"/>
    </g>
    <!-- 云 -->
    <path id="ic-cloud" d="M -14,10 C -21,10 -21,-1 -14,-1 C -15,-12 -1,-15 3,-8 C 9,-14 19,-10 18,-2 C 23,-2 23,10 14,10 Z"/>
    <!-- 对话气泡 -->
    <path id="ic-chat" d="M -15,-11 H 15 A 5,5 0 0 1 20,-6 V 3 A 5,5 0 0 1 15,8 H -2 L -9,15 V 8 H -15 A 5,5 0 0 1 -20,3 V -6 A 5,5 0 0 1 -15,-11 Z"/>
    <!-- 日历 -->
    <g id="ic-cal" fill="none" stroke="currentColor" stroke-width="5">
      <rect x="-14" y="-12" width="28" height="26" rx="5"/>
      <path d="M -14,-4 H 14" stroke-width="4"/>
      <rect x="-7" y="-17" width="5" height="8" rx="2.5" fill="currentColor" stroke="none"/>
      <rect x="3" y="-17" width="5" height="8" rx="2.5" fill="currentColor" stroke="none"/>
    </g>
    <!-- 星星 -->
    <path id="ic-star" d="M 0,-17 L 5,-6 L 17,-5 L 8,3 L 11,15 L 0,8 L -11,15 L -8,3 L -17,-5 L -5,-6 Z"/>
    <!-- 放大镜 -->
    <g id="ic-search" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <circle cx="-3" cy="-3" r="10"/>
      <path d="M 4,4 L 12,12" stroke-width="6"/>
    </g>
    <!-- 播放 -->
    <g id="ic-play" fill="none" stroke="currentColor" stroke-width="5">
      <circle r="15"/>
      <path d="M -3,-8 L 10,0 L -3,8 Z" fill="currentColor" stroke="none"/>
    </g>
    <!-- 定位针 -->
    <g id="ic-pin">
      <path d="M 0,-15 C 8,-15 12,-8 12,-2 C 12,7 0,16 0,16 C 0,16 -12,7 -12,-2 C -12,-8 -8,-15 0,-15 Z"/>
      <circle cx="0" cy="-2" r="4.5" fill="#8A9099"/>
    </g>
    <!-- 文件夹 -->
    <path id="ic-folder" d="M -17,-6 H -7 L -3,-12 H 17 V 10 A 4,4 0 0 1 13,14 H -13 A 4,4 0 0 1 -17,10 Z"/>
    <!-- 照片（山与日） -->
    <g id="ic-photo">
      <circle cx="-8" cy="-7" r="6.5"/>
      <path d="M -17,13 L -5,-1 L 1,6 L 7,-2 L 17,13 Z"/>
    </g>
  </defs>

  <!-- PAD：深空石墨机身，悬浮于透明之中 -->
  <g transform="translate(0,14)">
    <rect x="96" y="224" width="832" height="576" rx="80"
          fill="#101216" opacity="0.22" filter="url(#soft)"/>
  </g>
  <rect x="96" y="224" width="832" height="576" rx="80" fill="#2E3238"/>
  <circle cx="512" cy="237" r="6" fill="#17191C"/>
  <rect x="124" y="252" width="776" height="520" rx="58" fill="#FFFFFF"/>

  <!-- 音乐播放器：封面、曲目、进度、三枚琴键（内部元素以 x=252 中轴线对位） -->
  <rect x="152" y="296" width="200" height="346" rx="44" fill="#3A3F47"/>
  <rect x="184" y="320" width="136" height="136" rx="26" fill="#FFFFFF" opacity="0.92"/>
  <g transform="translate(252,388)" fill="#3A3F47"><use href="#ic-note"/></g>
  <rect x="187" y="496" width="130" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
  <rect x="208" y="520" width="88" height="12" rx="6" fill="#FFFFFF" opacity="0.45"/>
  <rect x="176" y="534" width="152" height="6" rx="3" fill="#FFFFFF" opacity="0.25"/>
  <rect x="176" y="534" width="96" height="6" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="272" cy="537" r="7" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="200" cy="592" r="20" fill="#FFFFFF" opacity="0.5"/>
  <path d="M 197,582 L 210,592 L 197,602 Z" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="252" cy="592" r="20" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 245,582 L 263,592 L 245,602 Z" fill="#3A3F47"/>
  <circle cx="304" cy="592" r="20" fill="#FFFFFF" opacity="0.5"/>
  <path d="M 307,582 L 294,592 L 307,602 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- 应用网格：四列三行，正中央为让位而空；深浅两档灰，符号一律白 -->
  <rect x="420" y="330" width="88" height="88" rx="22" fill="#3A3F47"/>
  <g transform="translate(464,374)" color="#FFFFFF"><use href="#ic-photo"/></g>
  <rect x="532" y="330" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(576,374)" color="#FFFFFF"><use href="#ic-clock"/></g>
  <rect x="644" y="330" width="88" height="88" rx="22" fill="#3A3F47"/>
  <g transform="translate(688,374)" color="#FFFFFF"><use href="#ic-cloud"/></g>
  <rect x="756" y="330" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(800,374)" color="#FFFFFF"><use href="#ic-note"/></g>

  <rect x="420" y="442" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(464,486)" color="#FFFFFF"><use href="#ic-chat"/></g>
  <rect x="644" y="442" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(688,486)" color="#FFFFFF"><use href="#ic-cal"/></g>
  <rect x="756" y="442" width="88" height="88" rx="22" fill="#3A3F47"/>
  <g transform="translate(800,486)" color="#FFFFFF"><use href="#ic-star"/></g>

  <rect x="420" y="554" width="88" height="88" rx="22" fill="#3A3F47"/>
  <g transform="translate(464,598)" color="#FFFFFF"><use href="#ic-search"/></g>
  <rect x="532" y="554" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(576,598)" color="#FFFFFF"><use href="#ic-play"/></g>
  <rect x="644" y="554" width="88" height="88" rx="22" fill="#3A3F47"/>
  <g transform="translate(688,598)" color="#FFFFFF"><use href="#ic-pin"/></g>
  <rect x="756" y="554" width="88" height="88" rx="22" fill="#8A9099"/>
  <g transform="translate(800,598)" color="#FFFFFF"><use href="#ic-folder"/></g>

  <!-- 托盘：只包裹三枚图标，如盛着三颗卵石的木碟 -->
  <rect x="420" y="700" width="184" height="48" rx="24" fill="#2E3238" opacity="0.10"/>
  <rect x="436" y="706" width="36" height="36" rx="10" fill="#3A3F47"/>
  <rect x="494" y="706" width="36" height="36" rx="10" fill="#8A9099"/>
  <rect x="562" y="706" width="36" height="36" rx="10" fill="#FF9F43"/>
</svg>
